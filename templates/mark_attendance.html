{% extends "home.html" %}

{% block content %}
<h2>Mark Attendance</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label> {{ field }}
            {% if field.errors %}
                <div style="color: red;">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit">Save Attendance</button>
</form>
{% endblock content %}
