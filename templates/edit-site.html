{% extends "home.html" %}

{% block content %}
<form action="{% url "edit-site" site.id %}" method="post">
    {% csrf_token %}
    {{form.as_p}}
    {% if field.errors %}
        <div style="color: red;">{{ field.errors }}</div>
    {% endif %}
    <input type="submit" value='Update'>
</form>
{% endblock content %}
