<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients with Sites</title>
</head>
<body>
    <h2>All Clients Data</h2>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Client Name</th>
                <th>Client Address</th>
                <th>GSTIN</th>
                <th colspan='2'>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
                <td>{{ client.clientName }}</td>
                <td>{{ client.clientAddress }}</td>
                <td>{{ client.clientGstin }}</td>
                <td><a href="{% url "delete-client" client.id %}">Delete</a></td>
                <td><a href="{% url "edit-client" client.id %}">Edit</a></td>
            </tr>  
            {% empty %}
            <tr>
                <td colspan="2">No clients found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
