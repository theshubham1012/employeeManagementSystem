{% extends "home.html" %}

{% block content %}
    <h2>Employee Registration</h2>
    <form action='{% url "add-employee" %}' method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if field.errors %}
                <div style="color: red;">{{ field.errors }}</div>
            {% endif %}
        <button type="submit">Save</button>
    </form>
{% endblock content %}
