{% extends "base.html" %}

{% block content %}
<div class="form-page">
    <a class="back" href="{% url 'home' %}">&larr; Back to dashboard</a>
    <div class="form-card">
        <h1>Edit Site details</h1>
        <form action="{% url "edit-site" site.id %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if field.errors %}
                <div style="color: red;">{{ field.errors }}</div>
            {% endif %}
            <input type="submit" value="Save">
        </form>
    </div>
</div>
{% endblock content %}
